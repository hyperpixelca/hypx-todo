<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Jack's To-Do</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--hot:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaee;--muted:#9aa1ad;--line:#2a2f3a;--accent:#60a5fa;--hot:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{margin:0 0 4px;font-size:26px}.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.bar button.on{border-color:var(--accent);color:var(--accent)}
.count{color:var(--muted);margin-left:auto}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px}
h2{font-size:16px;margin:12px 0 4px}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
h2+.item{border-top:none}
.item input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent);cursor:pointer}
.t{font-weight:600}.d{color:var(--muted);font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;font-weight:500}
.tag.hot{color:var(--hot);border-color:var(--hot)}
.item.done .t,.item.done .d{text-decoration:line-through;opacity:.55}
.hide-done .item.done{display:none}
.del{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.add{display:flex;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.add button{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.foot{color:var(--muted);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<main id="app">
<h1>Jack's To-Do</h1>
<p class="sub">Things only you can do by hand. Last updated by Ops Orchestrator: <span id="updated"></span></p>
<div class="bar">
  <button id="toggleDone">Hide done</button>
  <span class="count" id="count"></span>
</div>
<div id="lists"></div>
<section>
  <h2>My own notes</h2>
  <div id="mine"></div>
  <div class="add"><input id="newItem" placeholder="Add your own item and press Enter"><button id="addBtn">Add</button></div>
</section>
<p class="foot">Your checkmarks and your own items save in this browser. Ops Orchestrator updates the main list here, at the same address.</p>
</main>
<script>
// ===== Ops Orchestrator edits this block =====
const UPDATED = "Thu Oct 22, 2026, 3:00 PM PT";
const LISTS = [
 {title:"East Lawn website edits", items:[
  {id:"el-planning-call", t:"Tap-to-call link on /planning/", d:"This page gets the preplanning traffic. Keep the preplan form on /planning/, and tell Website Manager before you move or swap it.", tag:"Top priority", hot:true},
  {id:"el-home-popup", t:"Homepage \"A Death Has Occurred\" popup", d:"Point both copies of the hero button at one Elementor Pro popup with 4 tap-to-call buttons: East Sac 732-2000, Greenback & I80 732-2020, Elk Grove 732-2031, South Sac 732-2026. In the button's Link field, go to Dynamic Tags, then Actions, then Popup."},
  {id:"el-3pages-call", t:"Tap-to-call links on /services/, /obituaries/, /frequently-asked-questions/"},
  {id:"el-chapel-numbers", t:"Move each chapel page's own number near the top", d:"/east-sacramento/, /greenback-i80/, /elk-grove/, /south-sacramento/. South Sac can wait while its campaign is paused."},
  {id:"el-price-page", t:"Make a permanent price list page", d:"Until it exists, the Ads price sitelink points to /services/."}
 ]},
 {title:"Replies and calls you owe", items:[
  {id:"cbs-reply", t:"Andrea: reply on the CBS proposal from Samantha Ellis", d:"My take was fair to good if CBS re-runs the numbers for 55+ and 35+, puts the bonus spots in writing, swaps some :05s for :30s, adds streaming, and gives a post-campaign report.", tag:"East Lawn"},
  {id:"salem-review", t:"Andrea: Salem Media radio proposal for 2027", d:"She wants your review and a conversation. Lauri Adkins follows up early next week.", tag:"East Lawn"},
  {id:"shayan-tag", t:"Shayan (BLC): confirm the redirect tag", d:"Either confirm the form always redirects with exactly ?submitted=1, or have the Meta rule match on submitted=. After that the new number goes in and the HTML zip goes to Shayan.", tag:"RHR"},
  {id:"tribute-sarah", t:"Sarah Mills (Tribute Tech): the Elementor issue", d:"Check with Joshua at PSP that it's resolved, then reply to Sarah.", tag:"East Lawn"},
  {id:"gaynell-fb-email", t:"Gaynell: update the old email address on her Facebook page", d:"She asked on 10/16. There's an unsent draft in that thread.", tag:"Gaynell"},
  {id:"gameday-grill", t:"Nelanne Bergeron: Gameday Grill Facebook appointment request", tag:"Prospect"},
  {id:"stephanie-consult", t:"Stephanie Mena consult", tag:"Oct 27"}
 ]},
 {title:"Go-aheads the bots are waiting on", items:[
  {id:"wrong-numbers", t:"Wrong-number calls: Google Ads Bot investigates, review only", d:"Genaro says about every other call since the weekend is a wrong number.", tag:"Priority", hot:true},
  {id:"mc-sept-import", t:"East Lawn September Mailchimp import: Newsletter Bot", d:"Andrea sent 4 location files in \"AN Mortuary Sept. 2026\" on 10/21."},
  {id:"sonny-photo", t:"Sonny Beltram staff photo swap: Website Manager", d:"Andrea requested this on monday.com."},
  {id:"rhr-launch-go", t:"RHR Meta launch: final go", d:"The campaign is built and paused. Once the tag is confirmed, the pages get installed and tracking gets tested. Then you give the go."}
 ]}
];
// ===== end of edit block =====
const K="jack-todo-v1";
const S=JSON.parse(localStorage.getItem(K)||'{"done":{},"mine":[],"hide":false}');
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function row(it,mine,i){const done=!!S.done[it.id];
 return `<div class="item ${done?"done":""}"><input type="checkbox" data-id="${it.id}" ${done?"checked":""}><div><div class="t">${esc(it.t)}${it.tag?`<span class="tag ${it.hot?"hot":""}">${esc(it.tag)}</span>`:""}</div>${it.d?`<div class="d">${esc(it.d)}</div>`:""}</div>${mine?`<button class="del" data-i="${i}" title="Remove">×</button>`:""}</div>`}
function render(){
 document.getElementById("updated").textContent=UPDATED;
 document.getElementById("lists").innerHTML=LISTS.map(l=>`<section><h2>${esc(l.title)}</h2>${l.items.map(it=>row(it)).join("")}</section>`).join("");
 document.getElementById("mine").innerHTML=S.mine.map((it,i)=>row(it,true,i)).join("");
 document.getElementById("app").classList.toggle("hide-done",S.hide);
 document.getElementById("toggleDone").classList.toggle("on",S.hide);
 const all=[...LISTS.flatMap(l=>l.items),...S.mine];const n=all.filter(i=>S.done[i.id]).length;
 document.getElementById("count").textContent=`${n} of ${all.length} done`;
}
document.addEventListener("change",e=>{if(e.target.dataset.id){S.done[e.target.dataset.id]=e.target.checked;if(!e.target.checked)delete S.done[e.target.dataset.id];save();render()}});
document.addEventListener("click",e=>{if(e.target.classList.contains("del")){const it=S.mine.splice(+e.target.dataset.i,1)[0];delete S.done[it.id];save();render()}});
function add(){const v=document.getElementById("newItem").value.trim();if(!v)return;S.mine.push({id:"mine-"+Date.now(),t:v});document.getElementById("newItem").value="";save();render()}
document.getElementById("addBtn").onclick=add;
document.getElementById("newItem").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
document.getElementById("toggleDone").onclick=()=>{S.hide=!S.hide;save();render()};
render();
</script>
</body>
</html>
